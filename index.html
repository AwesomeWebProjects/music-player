<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player — Web Components Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.9); }
    p { font-size: 0.875rem; color: rgba(255,255,255,0.5); margin-bottom: 2rem; }
    nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    nav button {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    nav button:hover { background: rgba(255,255,255,0.12); }
    nav button.active {
      background: rgba(97, 218, 251, 0.15);
      color: rgba(97, 218, 251, 0.9);
      border-color: rgba(97, 218, 251, 0.3);
    }
    .player-area {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 800px;
    }
    .hidden { display: none !important; }
    footer {
      margin-top: auto;
      padding-top: 2rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      text-align: center;
    }
    footer a { color: rgba(97, 218, 251, 0.6); text-decoration: none; }
    footer a:hover { color: rgba(97, 218, 251, 0.9); }
  </style>
</head>
<body>
  <h1>Music Player — Web Components</h1>
  <p>Framework-agnostic audio player powered by @awesome-web-projects/audio-engine</p>

  <nav id="nav">
    <button class="active" data-view="minimal">Minimal</button>
    <button data-view="waveform">Waveform</button>
    <button data-view="vinyl">Vinyl</button>
    <button data-view="glass">Glass</button>
    <button data-view="circular">Circular</button>
  </nav>

  <div class="player-area">
    <music-player-minimal id="minimal" color="rgba(97, 218, 251, 0.8)"></music-player-minimal>
    <music-player-waveform id="waveform" class="hidden" color="rgba(97, 218, 251, 0.8)"></music-player-waveform>
    <music-player-vinyl id="vinyl" class="hidden" color="rgba(97, 218, 251, 0.8)"></music-player-vinyl>
    <music-player-glass id="glass" class="hidden" color="rgba(97, 218, 251, 0.8)"></music-player-glass>
    <music-player-circular id="circular" class="hidden" color="rgba(97, 218, 251, 0.8)"></music-player-circular>
  </div>

  <footer>
    <div style="margin-bottom: 0.5rem">
      <span>Space</span> Play/Pause &nbsp;|&nbsp;
      <span>N</span> Next &nbsp;|&nbsp;
      <span>B</span> Previous
    </div>
    <a href="https://github.com/danielbarion/music-player" target="_blank" rel="noopener">GitHub</a>
    <span style="margin: 0 0.5rem">·</span>
    v1.0.0
  </footer>

  <script type="module">
    import './src/index.ts';

    const tracks = [
      { name: 'Legends Never Die', artist: 'League of Legends', url: '/tracks/legends-never-die.mp3' },
      { name: 'Rise', artist: 'League of Legends', url: '/tracks/rise.mp3' },
      { name: 'Fantastic — Cinematic Sound', artist: 'AudioJungle', url: '/tracks/fantastic.mp3' },
    ];

    // Set tracks on all players
    document.querySelectorAll('[id]').forEach(el => {
      if ('tracks' in el) el.tracks = tracks;
    });

    // View switching
    const nav = document.getElementById('nav');
    const ids = ['minimal', 'waveform', 'vinyl', 'glass', 'circular'];

    nav.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-view]');
      if (!btn) return;
      const view = btn.dataset.view;

      nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      ids.forEach(id => {
        const el = document.getElementById(id);
        const hiding = id !== view;
        // Pause the player being hidden so music doesn't keep playing
        if (hiding && el.pause) el.pause();
        el.classList.toggle('hidden', hiding);
      });
    });
  </script>
</body>
</html>
